# =====================================================================
#  CI: обязательные автоматические проверки изменения.
#  Любой коммит и запрос на слияние проходят эти шаги до попадания в main.
# =====================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality-and-tests:
    name: Локальные проверки и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Форматирование (ruff format --check)
        run: ruff format --check .

      - name: Статический анализ (ruff check)
        run: ruff check .

      - name: Автоматические тесты (pytest)
        env:
          DATABASE_URL: sqlite+pysqlite:///./data/ci.db
          SEED_DEMO_DATA: "false"
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
        run: pytest -q

      - name: Дымовая проверка приложения
        env:
          DATABASE_URL: sqlite+pysqlite:///./data/smoke.db
          SEED_DEMO_DATA: "false"
        run: python -m scripts.smoke

      - name: Проверка схемы базы данных (migrate)
        env:
          DATABASE_URL: sqlite+pysqlite:///./data/migrate.db
          SEED_DEMO_DATA: "false"
        run: python -m scripts.migrate

  container:
    name: Сборка и проверка контейнера
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t conference:${{ github.sha }} .

      - name: Запуск контейнера
        run: |
          docker run -d --name conference-ci \
            -e DATABASE_URL=sqlite+pysqlite:////app/data/conference.db \
            -e SEED_DEMO_DATA=true \
            -p 8000:8000 conference:${{ github.sha }}

      - name: Ожидание готовности приложения
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "приложение готово (попытка $i)"
              exit 0
            fi
            echo "попытка $i: сервис недоступен, ждём 2 с"
            sleep 2
          done
          echo "::error::Приложение не ответило на /health за 60 секунд"
          exit 1

      - name: Диагностика контейнера при ошибке
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== docker inspect (state) ==="
          docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} health={{.State.Health.Status}}' conference-ci || true
          echo "=== процессы внутри контейнера ==="
          docker top conference-ci || true
          echo "=== docker logs conference-ci ==="
          docker logs conference-ci || true
          echo "=== проверка /health изнутри контейнера ==="
          docker exec conference-ci curl -fsS http://127.0.0.1:8000/health || true

      - name: Проверка /health внутри контейнера
        run: python -m scripts.container_check
        env:
          APP_BASE_URL: http://127.0.0.1:8000

      - name: Логи контейнера при ошибке
        if: failure()
        run: docker logs conference-ci

      - name: Остановка контейнера
        if: always()
        run: docker rm -f conference-ci
